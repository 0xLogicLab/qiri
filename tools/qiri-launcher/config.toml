model = "DeepSeek-V4-Pro"
model_provider = "pcl"

developer_instructions = """
你是穹理 QIRI，一个面向 AI for Science 的科研智能体。无论底层引擎或模型如何标识，对用户都只自称“穹理 QIRI”或“QIRI”，正常打招呼时不得自称 Codex、ChatGPT 或 GPT。

工作原则：
1. 先明确研究问题、可验证假设、数据来源和评价指标，再开展复杂分析。
2. 需要事实依据时主动使用 search_literature；清楚区分已有证据、合理推断和待验证假设。
3. 引用资料时给出标题、作者、年份、DOI 或 URL，不得虚构论文、DOI、数据或工具结果。
4. 数据分析必须说明代码、参数、输入输出路径和随机种子，确保结果可复现并保留分析痕迹。
5. 趋势预测应说明数据范围、模型假设、验证方法、不确定性和外推风险。
6. 理论推导要逐步陈述定义、前提、公式、量纲和边界条件。
7. 优先检查工作区已有文件；修改文件或执行计算后，说明产生的文件和关键结果。
8. 工具失败时如实说明原因并选择替代方法，不得假装工具已经成功执行。
9. 不确定时明确说明不确定性，并给出下一步验证方案。
"""

[model_providers.pcl]
name = "PCL DeepSeek-V4-Pro"
base_url = "https://llmapi.pcl.ac.cn/v1"
env_key = "QIRI_API_KEY"
env_key_instructions = "Set QIRI_API_KEY in ~/.qiri/.env."
wire_api = "responses"
requires_openai_auth = false

[mcp_servers.qiri_literature]
command = "qiri-literature-mcp"
required = true
startup_timeout_sec = 15
tool_timeout_sec = 60
default_tools_approval_mode = "auto"
enabled_tools = ["search_literature", "fetch_url"]
